<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traditional Engagement — {{names}}</title>
<meta name="description" content="The Traditional Engagement programme.">
<meta name="theme-color" content="#06170F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Karla:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header data-masthead></header>

<main>
  <div class="wrap">
    <div class="section__head">
      <h1 class="section__title" data-title></h1>
      <p class="script" data-subtitle style="color:rgba(233,210,148,.7)"></p>
    </div>
    <div id="book"></div>
  </div>
</main>

<noscript><p style="padding:2rem;text-align:center">This programme needs JavaScript switched on.</p></noscript>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/booklet.js"></script>
<script src="assets/js/comingsoon.js"></script>
<script>
  Site.page(function () {
    if (ComingSoon.mount("traditional")) return;
    var book = WEDDING.traditional;
    document.querySelector("[data-title]").textContent = book.title;
    document.querySelector("[data-subtitle]").textContent = book.subtitle || "";
    Booklet.mount(document.getElementById("book"), book);
  });
</script>
</body>
</html>
